mapiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://helm.elastic.co
    chart: eck-stack
    targetRevision: 0.14.0 # Replace with desired chart version
    helm:
      releaseName: eck-test
      valuesObject:
        eck-elasticsearch:
          nodeSets:
            - name: default
              count: 1
              config:
                node.store.allow_mmap: false
              podTemplate:
                spec:
                  containers:
                    - name: elasticsearch
                      env:
                        - name: ES_JAVA_OPTS
                          value: "-Xms512m -Xmx512m"
                      resources:
                        requests:
                          memory: 1Gi
                          cpu: 250m
                        limits:
                          memory: 1.5Gi
                          cpu: 1000m
              volumeClaimTemplates:
                - metadata:
                    name: elasticsearch-data
                  spec:
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 5Gi
        eck-kibana:
          count: 1
          podTemplate:
            spec:
              containers:
                - name: kibana
                  resources:
                    requests:
                      memory: 512Mi
                      cpu: 200m
                    limits:
                      memory: 1Gi
                      cpu: 500m
  destination:
    server: https://kubernets.default.svc
    namespace: elastic-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
